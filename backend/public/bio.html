<style>
  :root{
    --ink:#0b0b0a; --ink-2:#151412; --ink-3:#221f18; --line-dark:#3d3627;
    --gold-1:#eaffb0; --gold-2:#a8e063; --gold-3:#7cc72f; --gold-4:#4f8f1a;
    --gold-grad:linear-gradient(135deg,var(--gold-1) 0%,var(--gold-2) 32%,var(--gold-3) 62%,var(--gold-4) 100%);
    --on-dark:#f6f2e6; --on-dark-muted:#cdc4a4;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
    background:var(--ink);color:var(--on-dark);-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;justify-content:center;padding:52px 20px 60px;
  }
  .wrap{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;}
  .logo-mark{width:180px;margin-bottom:6px;}
  .logo-mark img{width:100%;height:auto;display:block;}
  h1{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:600;font-size:1.6rem;text-align:center;color:var(--gold-2);}
  p.tag{font-size:.8rem;color:var(--on-dark-muted);text-align:center;margin-top:6px;letter-spacing:.02em;}

  .links{width:100%;margin-top:32px;display:flex;flex-direction:column;gap:14px;}
  .link-btn{
    display:flex;align-items:center;gap:14px;width:100%;padding:16px 20px;border-radius:16px;
    background:var(--ink-2);border:1.5px solid var(--line-dark);color:var(--on-dark);text-decoration:none;
    font-weight:700;font-size:.9rem;letter-spacing:.01em;transition:.18s;
  }
  .link-btn:hover, .link-btn:active{border-color:var(--gold-3);background:var(--ink-3);transform:translateY(-1px);}
  .link-btn.featured{background:var(--gold-grad);color:var(--ink);border-color:transparent;box-shadow:0 10px 26px rgba(124,199,47,.28);}
  .link-btn.featured:hover{filter:brightness(1.04);}
  .link-btn.featured small{color:rgba(11,11,10,.65);}
  .link-icon{width:26px;height:26px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--gold-2);}
  .link-btn.featured .link-icon, .link-btn.featured .arrow{color:var(--ink);}
  .link-icon svg{width:22px;height:22px;}
  .link-text{flex:1;}
  .link-text small{display:block;font-weight:500;font-size:.7rem;color:var(--on-dark-muted);margin-top:2px;}
  .arrow{opacity:.55;font-size:1rem;color:var(--gold-2);}

  footer{margin-top:40px;text-align:center;color:var(--on-dark-muted);font-size:.7rem;letter-spacing:.03em;opacity:.7;}
</style>
